["🐦","Thirsty Crow","Moral Stories","Easy","It was a hot summer day and a crow was flying in search of water. He was so thirsty that he could hardly move his wings. At last he saw a pot lying under a tree. He hurried down and peeped inside, but there was very little water at the bottom. His beak could not reach it. The crow did not give up. He looked around and found many small stones. One by one he picked them up and dropped them into the pot. Slowly the water rose to the top. The clever crow drank happily and flew away. Where there is a will, there is always a way."],

["👨‍🌾","Clever Farmer","Moral Stories","Medium","A farmer had three sons who quarreled every day. He tried to advise them but they never listened. One morning he asked them to bring a bundle of sticks. He gave the bundle to each son and asked him to break it. None of them could. Then the farmer untied the bundle and gave each son a single stick. They broke the sticks easily. The farmer smiled and said that united they were strong, but divided they were weak. From that day the brothers worked together, and their farm grew rich and green under the warm sun."],

["🐢","Hare and Tortoise","Moral Stories","Medium","A hare laughed at a tortoise for walking so slowly. The tortoise smiled and challenged him to a race. The hare agreed, sure that he would win with ease. The race began and the hare ran far ahead. Seeing the tortoise far behind, he lay under a tree to rest and soon fell asleep. The tortoise kept walking, slow and steady, without stopping. When the hare woke up, the tortoise was almost at the finish line. He ran fast but it was too late. Slow and steady wins the race, and pride often leads to failure."],
["🐺","Boy Who Cried Wolf","Moral Stories","Medium","A shepherd boy looked after sheep on a green hill near his village. Feeling bored, he shouted that a wolf was coming. The villagers ran up with sticks, but found no wolf. The boy laughed at them. He played the same trick the next day. Then one evening a real wolf came and attacked the flock. The boy screamed for help, but nobody believed him this time. The wolf scattered the sheep, and the boy wept in shame. Liars are not believed even when they speak the truth, so always be honest with people."],
["🐜","Ant and Grasshopper","Moral Stories","Easy","All summer long a grasshopper sang and played in the fields while a small ant worked hard carrying grain to her nest. The grasshopper laughed at her and asked her to join the fun. The ant replied that she was preparing for the winter. When winter arrived, snow covered the ground and the grasshopper had no food. Cold and hungry, he knocked at the ant's door and begged for help. The ant shared a little, but reminded him to work in time. Hard work today brings comfort tomorrow, and wise people always prepare early."],
["🤝","Two Friends","Moral Stories","Medium","Two friends were walking through a forest when they saw a bear coming toward them. One friend quickly climbed a tree and left the other alone. The second friend knew that bears do not touch dead bodies, so he lay still on the ground and held his breath. The bear sniffed his ear and walked away. The friend in the tree came down and asked what the bear had whispered. He answered that the bear advised him never to trust a friend who leaves you in danger. A true friend stands beside you when troubles come."],
["🥚","Golden Egg","Moral Stories","Hard","A poor farmer discovered that his goose laid a shining golden egg every single day. He sold each egg at the market and soon became a wealthy man with a fine house. But as his fortune grew, so did his impatience. He decided that the goose must hold a mountain of gold inside her body. Ignoring the warnings of his neighbors, he killed the goose and opened her, only to find that she was like any other bird. His steady source of wealth was gone forever. Contentment and patience protect our blessings, whereas greed leaves us empty-handed."],

<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:20px 0">${[["WPM",s.net,1],["Gross WPM",s.gross,1],["Net WPM",s.net,1],["Accuracy %",s.acc,1],["Errors",sess.bad,0],["Correct Chars",sess.ok,0],["Time (s)",s.e,1],["CPM",s.cpm,0]].map(x=>`<div class="glass stat"><b class="cu" data-to="${x[1]}" data-d="${x[2]}">0</b><span>${x[0]}</span></div>`).join("")}</div>
<div class="glass pad"><p>Personal Best: <b>${Math.max(prevBest,s.net).toFixed(1)}</b> · Previous Best: <b>${prevBest.toFixed(1)}</b> · Average: <b>${avg(D.tests.map(x=>x.net)).toFixed(1)}</b> · Improvement vs avg: <b style="color:${s.net>=prevAvg?"var(--a4)":"var(--a3)"}">${(s.net-prevAvg>=0?"+":"")+(s.net-prevAvg).toFixed(1)}</b> · Target ${sess.tw}: ${s.net>=sess.tw?"✅ reached":"not yet"}</p></div>
<div class="row" style="justify-content:center;margin-top:16px"><button class="btn" id="ra">Try Again</button><button class="btn sec" onclick="go('practice')">Change Paragraph</button><button class="btn sec" onclick="go('home')">Home</button><button class="btn sec" onclick="go('progress')">View Statistics</button></div>`;
const txt=sess.text,op={rt:txt,limit:sess.limit,title:sess.title,tw:sess.tw,mode:sess.mode,chk:sess.chk,gid:sess.gid};$("#ra").onclick=()=>begin(txt,op);
$$(".screen").forEach(x=>x.classList.toggle("on",x.id==="s-result"));cur="result";document.body.classList.remove("fm");

/* ===== PROGRESS ===== */
function chart(id,data,color,max){const c=document.getElementById(id);if(!c)return;const w=c.width=c.clientWidth*2,h=c.height=340,x=c.getContext("2d");x.clearRect(0,0,w,h);if(!data.length){x.fillStyle="#fff8";x.font="28px sans-serif";x.fillText("No data yet",20,60);return}
const m=max||Math.max(...data,1)*1.15,bw=w/Math.max(data.length,10);x.fillStyle=color;data.forEach((v,i)=>{const bh=v/m*(h-30);x.globalAlpha=.85;x.beginPath();x.roundRect?x.roundRect(i*bw+4,h-bh,bw-8,bh,8):x.rect(i*bw+4,h-bh,bw-8,bh);x.fill()});x.globalAlpha=1}
function progress(){const t=D.tests,ks=Object.entries(D.keys).filter(([c,k])=>k.t>=3&&/\S/.test(c)).map(([c,k])=>[c,k.e/k.t*100,k.e]).sort((a,b)=>b[1]-a[1]).slice(0,8);
const act=n=>Array.from({length:n},(_,i)=>{const d=day(Date.now()-(n-1-i)*864e5);return t.filter(x=>day(x.at)===d).length});
$("#s-progress").innerHTML=`<h1 class="big">Progress</h1><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:16px 0">${[["Best WPM",Math.max(0,...t.map(x=>x.net)).toFixed(1)],["Avg WPM",avg(t.map(x=>x.net)).toFixed(1)],["Best Accuracy",Math.max(0,...t.map(x=>x.acc)).toFixed(1)+"%"],["Avg Accuracy",avg(t.map(x=>x.acc)).toFixed(1)+"%"],["Tests",t.length],["Typing Time",fmt(t.reduce((a,x)=>a+x.time,0))],["Characters",t.reduce((a,x)=>a+x.chars,0)],["Errors",t.reduce((a,x)=>a+x.err,0)],["Lessons",D.lessons.length+"/12"]].map(x=>`<div class="glass stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("")}</div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="glass pad"><h3>WPM history</h3><canvas class="ch" id="c1"></canvas></div><div class="glass pad"><h3>Accuracy history</h3><canvas class="ch" id="c2"></canvas></div><div class="glass pad"><h3>Daily activity (14 days)</h3><canvas class="ch" id="c3"></canvas></div><div class="glass pad"><h3>Weekly activity (8 weeks)</h3><canvas class="ch" id="c4"></canvas></div></div>
<div class="glass pad" style="margin-top:16px"><h3>🔥 Streak: ${streak()} days</h3><div class="row" style="margin:10px 0">${Array.from({length:28},(_,i)=>{const d=day(Date.now()-(27-i)*864e5);return `<span title="${d}" style="width:22px;height:22px;border-radius:6px;background:${D.days.includes(d)?"var(--a4)":"rgba(255,255,255,.1)"}"></span>`}).join("")}</div></div>
<div class="glass pad" style="margin-top:16px"><h3>Weak Keys</h3>${ks.length?`<p style="margin:10px 0">${ks.map(k=>`<b style="font-size:22px;color:var(--a3)">${k[0]}</b> <span class="tag">${k[1].toFixed(0)}% err</span>`).join(" ")}</p><button class="btn" id="wk">Practice Weak Keys</button>`:"<p style='opacity:.6'>Complete tests to discover weak keys.</p>"}</div>`;
chart("c1",t.slice(-30).map(x=>x.net),"#20C9FF");chart("c2",t.slice(-30).map(x=>x.acc),"#72F6D4",100);chart("c3",act(14),"#765CFF");chart("c4",Array.from({length:8},(_,w)=>act(56).slice(w*7,w*7+7).reduce((a,b)=>a+b,0)),"#FF4FA3");
const w=$("#wk");if(w)w.onclick=()=>{const chars=ks.map(k=>k[0]).join("").replace(/[^\w.,;'!?-]/g,"");if(!chars){toast("No practice keys found");return}let s=[];for(let i=0;i<40;i++){let wd="";for(let j=0;j<3+Math.random()*3;j++)wd+=chars[Math.random()*chars.length|0]+"aeiou"[Math.random()*5|0];s.push(wd)}sel={ic:"🎯",t:"Weak Keys",tx:s.join(" ")};go("wpm")}}
/* ===== ACHIEVEMENTS / DAILY / LEARN / SETTINGS ===== */
function ach(){$("#s-ach").innerHTML=`<h1 class="big">Achievements</h1><p style="opacity:.7;margin:8px 0">${D.ach.length}/${ACH.length} unlocked</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">${ACH.map(a=>`<div class="glass ach ${D.ach.includes(a[0])?"":"lock"}"><div>${D.ach.includes(a[0])?a[1]:"🔒"}</div><b>${a[0]}</b><p style="font-size:12px;opacity:.7">${a[2]}</p></div>`).join("")}</div>`}
function dailyC(){const d=new Date().getDate()+new Date().getMonth()*31;const w=[20,30,40,50,60,70,80][d%7];return{w,a:95,tm:60,p:P[d%P.length]}}
function daily(){const c=dailyC(),done=D.daily===day();$("#s-daily").innerHTML=`<h1 class="big">Daily Challenge</h1><div class="glass pad" style="margin-top:16px;text-align:center"><p style="letter-spacing:.2em;opacity:.7">TARGET</p><h2>${c.w} WPM</h2><p style="margin-top:10px">Accuracy ≥ ${c.a}% · Time ${c.tm} sec · Reward +100 XP</p><p style="margin:10px;opacity:.7">${c.p.ic} ${c.p.t}</p>${done?'<h3 style="color:var(--a4)">✅ Completed today!</h3>':""}<button class="btn" id="dg">${done?"Play again":"Start Challenge"}</button></div>`;$("#dg").onclick=()=>{sel=c.p;begin(c.p.tx,{limit:c.tm,tw:c.w,gid:1,chk:{w:c.w,a:c.a},mode:"Daily Challenge",title:"Daily: "+c.p.t})}}
function learn(){$("#s-learn").innerHTML=`<h1 class="big">Learn</h1><div class="grid" style="margin-top:16px">${LESSONS.map((l,i)=>`<div class="glass card" tabindex="0" data-l="${i}"><h3>Lesson ${i+1}: ${l[0]}</h3><p style="opacity:.7;font-size:13px;margin:8px 0">${l[1].slice(0,50)}…</p><div class="bar"><i style="width:${D.lessons.includes(i)?100:0}%"></i></div><p class="tag" style="margin-top:8px">${D.lessons.includes(i)?"✅ Completed":"Reach 90% accuracy"}</p></div>`).join("")}</div>`;$$("#s-learn .card").forEach(c=>{const f=()=>{const i=+c.dataset.l;sel={t:"Lesson "+(i+1)};const tx=(LESSONS[i][1]+" ").repeat(i<9?4:1).trim();begin(tx,{limit:0,title:"Lesson: "+LESSONS[i][0],tw:30,mode:"Lesson"});sess.lesson=i};c.onclick=f;c.onkeydown=e=>e.key==="Enter"&&f()})}
function settings(){const s=D.set,sl=(k,l,mn,mx,stp)=>`<label style="display:block;margin:10px 0">${l}: <b id="v-${k}">${s[k]}</b><br><input type="range" min="${mn}" max="${mx}" step="${stp}" value="${s[k]}" data-k="${k}" style="width:100%"></label>`,tg=(k,l)=>`<label style="margin-right:18px"><input type="checkbox" data-t="${k}" ${s[k]!==false?"checked":""}> ${l}</label>`;
$("#s-settings").innerHTML=`<h1 class="big">Settings</h1><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:16px"><div class="glass pad"><h3>Appearance</h3>Theme <select id="th">${Object.keys(THEMES).map(t=>`<option ${t===s.theme?"selected":""}>${t}</option>`).join("")}</select>${sl("blur","Glass Blur",0,50,1)}${sl("op","Glass Opacity",2,30,1)}${sl("fs","Text Size",18,52,1)}${sl("ls","Letter Spacing",0,6,.5)}${tg("reduced","Reduced Motion")}</div>
<div class="glass pad"><h3>Wallpaper</h3>${tg("wall","Wallpaper")}${tg("aurora","Aurora")}${tg("part","Particles")}${tg("orbs","Light Orbs")}${tg("par","Mouse Parallax")}${sl("spd","Wallpaper Speed",.2,3,.1)}${sl("bright","Wallpaper Brightness",.2,1.5,.1)}${sl("pd","Particle Density",0,3,.25)}</div>
<div class="glass pad"><h3>Sound</h3>${tg("snd","Sound effects")}${sl("vol","Volume",0,1,.05)}<h3 style="margin-top:14px">Shortcuts</h3><p style="font-size:13px;opacity:.8;line-height:1.7">Esc — pause · Space/Enter — resume · F — focus mode (when paused) · R — restart (when paused) · Tab — disabled while typing · F11 — browser fullscreen</p><button class="btn sec" id="rst" style="margin-top:10px">Reset all data</button></div></div>`;
$$("#s-settings input[type=range]").forEach(i=>i.oninput=()=>{s[i.dataset.k]=+i.value;$("#v-"+i.dataset.k).textContent=i.value;if(i.dataset.k==="pd")initP();apply();save()});
$$("#s-settings input[type=checkbox]").forEach(i=>i.onchange=()=>{s[i.dataset.t]=i.checked;if(i.dataset.t==="part")initP();apply();save()});$("#th").onchange=e=>{s.theme=e.target.value;apply();save()};
$("#rst").onclick=()=>{if(confirm("Delete ALL saved progress?")){try{localStorage.removeItem("syt")}catch(e){}location.reload()}}}
/* ===== INIT ===== */
$("#go").onclick=nameOk;$("#nm").onkeydown=e=>{if(e.key==="Enter")nameOk()};
apply();rs();frame();
if(D.name){$("#s-name").classList.remove("on");start()}else $("#nm").focus();
